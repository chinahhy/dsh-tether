name: check-ios

on:
  push:
    branches: [ios-only]
  pull_request:
    branches: [ios-only]
  workflow_dispatch:

jobs:
  rust-and-js:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p tether-core -p tether-host -p dsh-tether-app
      - run: cargo test -p tether-core
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check index.js
          node --check app/ui/main.js
          node --check scripts/pack-host.mjs
          node --check scripts/changelog-section.mjs
