name: build-native-ios

on:
  push:
    branches: [codex/native-mobile-v1]
    paths:
      - 'ios-native/**'
      - '.github/workflows/native-ios-preview.yml'
  workflow_dispatch:

jobs:
  unsigned-app:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Show Apple toolchain
        run: xcodebuild -version
      - name: Test protocol package
        run: swift test --package-path ios-native/ProtocolKit --scratch-path ios-native/ProtocolKit/.build
      - name: Get pinned XcodeGen
        run: |
          mkdir -p ios-native/.tools
          curl -fL --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o ios-native/.tools/xcodegen.zip
          unzip -q ios-native/.tools/xcodegen.zip -d ios-native/.tools
          test -x ios-native/.tools/xcodegen/bin/xcodegen
      - name: Generate Xcode project
        run: ios-native/.tools/xcodegen/bin/xcodegen generate --spec ios-native/project.yml --project ios-native
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project ios-native/DSHMobile.xcodeproj \
            -scheme DSHMobile -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios-native/.derivedData \
            -clonedSourcePackagesDirPath ios-native/.packages \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          app=ios-native/.derivedData/Build/Products/Release-iphoneos/DSHMobile.app
          test -d "$app"
          mkdir -p ios-native/dist/Payload
          cp -R "$app" ios-native/dist/Payload/
          (cd ios-native/dist && zip -qry dsh-mobile-unsigned.ipa Payload)
          shasum -a 256 ios-native/dist/dsh-mobile-unsigned.ipa
      - uses: actions/upload-artifact@v5
        with:
          name: dsh-mobile-unsigned
          path: ios-native/dist/dsh-mobile-unsigned.ipa
          if-no-files-found: error
