name: DSHMobilePreview
options:
  bundleIdPrefix: com.hoya.dsh
  deploymentTarget:
    iOS: '17.5'
  xcodeVersion: '15.4'
packages:
  DSHMobileProtocol:
    path: ProtocolKit
targets:
  DSHMobilePreview:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: DSHMobileProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoya.dsh.mobile.preview
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '5.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DSH Mobile Preview
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
schemes:
  DSHMobilePreview:
    build:
      targets:
        DSHMobilePreview: all
